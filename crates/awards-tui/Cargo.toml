[package]
name = "awards-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI and TUI for the FORSCOM Decorations Database"
repository.workspace = true

[[bin]]
name = "awards-tui"
path = "src/main.rs"

[dependencies]
awards-core = { workspace = true }
awards-sheets = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tui-input = { workspace = true }

# Binary install via `cargo binstall` (GitHub release assets from .github/workflows/release.yml).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
