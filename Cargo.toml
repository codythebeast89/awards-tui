[workspace]
resolver = "2"
members = [
    "crates/awards-core",
    "crates/awards-sheets",
    "crates/awards-tui",
]
default-members = ["crates/awards-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/codythebeast89/awards-tui"

[workspace.dependencies]
awards-core = { path = "crates/awards-core" }
awards-sheets = { path = "crates/awards-sheets" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
csv = "1"
jsonwebtoken = "10"
open = "5"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
strsim = "0.11"
tui-input = "0.11"
urlencoding = "2"
