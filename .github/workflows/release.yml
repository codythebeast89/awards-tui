name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build -p awards-tui --release --target ${{ matrix.target }}
      - name: Package (cargo-binstall layout)
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/awards-tui"
          STAGE="awards-tui-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/awards-tui"
          chmod +x "$STAGE/awards-tui"
          tar -czf "${STAGE}.tar.gz" -C "$STAGE" awards-tui
          echo "asset=${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"
        id: pkg
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: awards-tui-${{ matrix.target }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
